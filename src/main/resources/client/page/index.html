<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>废旧物品回收系统</title>
    <link rel="stylesheet" href="../static/modules/elementui/theme/index.css">
    <link rel="stylesheet" href="../static/modules/swiper/swiper.min.css">
    <link rel="stylesheet" href="../static/modules/animate.min.css">
    <script src="../static/modules/wow.min.js"></script>
    <link rel="stylesheet" href="../static/css/app.css">
    <link rel="stylesheet" href="../static/css/index.css">
    <link rel="stylesheet" href="../static/css/enhanced-ui.css">
    <script src="../static/modules/vue.min.js"></script>
    <script src="../static/modules/elementui/index.js"></script>

<body>
<el-container id="page" v-cloak>
    <el-header height="auto" id="pageHeader">
        <page-header></page-header>
        <nav-menu></nav-menu>
    </el-header>
    <el-container>
        <el-main id="main">
        <div id="child-page">
            <div class="swiper-row">
                <page-swiper></page-swiper>
            </div>
            <div class="search-row">
            </div>
            <!-- 环保理念横幅 -->
            <div class="eco-banner">
                <div class="eco-content">
                    <div class="eco-icon">♻️</div>
                    <div class="eco-text">
                        <h3>绿色回收，环保生活</h3>
                        <p>让每一件废旧物品都有价值，共建美好家园</p>
                    </div>
                </div>
            </div>
            
            <div class="show-row">
                <!-- 废旧物品信息首页展示 -->
                <div class="show-box recycle-box">
                    <div class="title-wrapper">
                        <div class="title-icon">📦</div>
                        <div class="title">废旧物品回收</div>
                        <div class="title-desc">让闲置物品重获新生</div>
                    </div>
                    <div class="list">
                        <div class="item" v-for="item in jiuwuxinxiHomeList" :key="item.id" @click="detailClick('jiuwuxinxi',item.id)">
                            <div class="item-image-wrapper">
                                <img v-if="isHttp(item.tupian)" :src="item.tupian.split(',')[0]">
                                <img v-else :src="item.tupian?baseUrl + item.tupian.split(',')[0]:''">
                                <div class="item-overlay">
                                    <div class="recycle-badge">可回收</div>
                                </div>
                            </div>
                            <div class="info">
                                <div class="info-item title-text">{{item.jiuwumingcheng}}</div>
                                <div class="info-item price-text">
                                    <span class="price-label">回收价</span>
                                    <span class="price-value">¥{{item.huishoudanjia}}</span>
                            </div>
                        </div>
                    </div>
                    </div>
                    <div class="more" @click="moreClick('jiuwuxinxi')">
                        <span>查看更多</span>
                        <iconfont icon="el-icon-arrow-right"></iconfont>
                    </div>
                </div>
                
                <!-- 资讯信息首页展示 -->
                <div class="show-box news-box-modern">
                    <div class="title-wrapper">
                        <div class="title-icon">📰</div>
                        <div class="title">环保资讯</div>
                        <div class="title-desc">了解最新回收动态</div>
                    </div>
                    <div class="list">
                        <div class="item" v-for="item in zixunxinxiHomeList" :key="item.id" @click="detailClick('zixunxinxi',item.id)">
                            <div class="item-image-wrapper">
                                <img v-if="isHttp(item.fengmian)" :src="item.fengmian.split(',')[0]">
                                <img v-else :src="item.fengmian?baseUrl + item.fengmian.split(',')[0]:''">
                                <div class="item-overlay">
                                    <div class="date-badge">{{item.faburiqi}}</div>
                                </div>
                            </div>
                            <div class="info">
                                <div class="info-item title-text">{{item.zixunbiaoti}}</div>
                                <div class="info-item date-text">{{item.faburiqi}}</div>
                            </div>
                        </div>
                    </div>
                    <div class="more" @click="moreClick('zixunxinxi')">
                        <span>查看更多</span>
                        <iconfont icon="el-icon-arrow-right"></iconfont>
                    </div>
                </div>
            </div>
        </div>
        </el-main>
    </el-container>
    <el-footer height="auto">
        <p></p>
    </el-footer>
</el-container>
</body>
<script src="../static/modules/axios.min.js"></script>
<script src="../utils/http.js"></script>
<script src="../utils/system.js"></script>
<script src="../utils/global_mixin.js"></script>
<script src="../utils/toolUtil.js"></script>
<!--引入组件-->
<script src="../components/page-header.js"></script>
<script src="../components/nav-menu.js"></script>
<script src="../components/swiper.js"></script>
<script src="../components/page-swiper.js"></script>
<script>
    var vm = new Vue({
        el: '#page',
        data(){
            return {
                zixunxinxiHomeList:[],
                jiuwuxinxiHomeList:[],
                token:toolUtil.storageGet("Token"),
            }
        },
        created(){
            this.init()
        },
        methods: {
            init(){
                this.getzixunxinxiHomeList()
                this.getjiuwuxinxiHomeList()
            },
            //资讯信息首页展示
            getzixunxinxiHomeList(){
                http.get('zixunxinxi/list',{
                    params:{
                        page: 1,
                        limit: 8
                    }
                }).then(res=>{
                    this.zixunxinxiHomeList = res.data.data.list
                })
            },
            //废旧物品信息首页展示
            getjiuwuxinxiHomeList(){
                http.get('jiuwuxinxi/list',{
                    params:{
                        page: 1,
                        limit: 8
                    }
                }).then(res=>{
                    this.jiuwuxinxiHomeList = res.data.data.list
                })
            },
            //判断图片链接是否带http
            isHttp(str){
                return str && str.substr(0,4)=='http';
            },
            //跳转详情
            detailClick(table,id){
                location.href = `${baseUrl}client/page/${table}/detail.html?id=${id}`
            },
            moreClick(table){
                location.href = `${baseUrl}client/page/${table}/list.html`
            },
        }
    })
</script>
